name: Deploy na serwer LH.pl

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Pobranie kodu
      uses: actions/checkout@v4

    - name: Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Zależności
      run: npm ci

    - name: Build deploy-bundle
      run: node scripts/build-deploy.mjs

    - name: Sync plików przez FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./deploy-bundle/
        server-dir: /public_html/proteiner.pl/
        log-level: verbose
        exclude: |
          **/.git*
          **/.github/**
          **/node_modules/**
          **/.cursor/**
          **/sw.js
          **/admin-*
          **/js/admin-*

    - name: Weryfikacja deployu
      run: |
        sleep 20
        for url in \
          "https://proteiner.pl/js/cookie-banner.js" \
          "https://proteiner.pl/js/products-lite.js" \
          "https://proteiner.pl/produkty/czekolada-100"; do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
          echo "HTTP $CODE → $url"
          if [ "$CODE" != "200" ]; then
            echo "::error::Weryfikacja nie powiodła się dla $url (HTTP $CODE)"
            exit 1
          fi
        done

  redirect-proteinmaxxing:
    name: Przekierowanie proteinmaxxing.pl
    runs-on: ubuntu-latest
    needs: web-deploy
    steps:
    - name: Pobranie kodu
      uses: actions/checkout@v4

    - name: Wgraj przekierowanie 301
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./domains/proteinmaxxing/
        server-dir: /public_html/proteinmaxxing.pl/

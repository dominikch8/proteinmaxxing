name: Deploy na serwer LH.pl

on:
  push:
    branches:
      - main
    # Commity tylko-CI nie wymagają wdrożenia strony — bez tego każdy commit
    # workflowa (i staging hotfixu) odpalał pełny sync FTP.
    paths-ignore:
      - '.github/**'
      - '.hotfix-ftp/**'
  workflow_dispatch:

# Watcher auto-commit wypycha commit co ~2,5 s, a każdy push odpalał osobny
# pełny sync FTP — w historii jest ~2 150 runów i burze po 10 równoległych
# połączeń FTP (serwer je zrywał: "write EPIPE / ECONNRESET (data socket)").
# Jeden deploy naraz; nowszy push anuluje poprzedni, nie czeka w kolejce.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Jeśli padnie na FTP z "530 Login incorrect" — zaktualizuj sekrety
    # FTP_SERVER / FTP_USERNAME / FTP_PASSWORD w GitHub → Settings → Secrets.
    timeout-minutes: 60
    steps:
    - name: Pobranie kodu
      uses: actions/checkout@v4

    - name: Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Zależności
      run: npm ci

    - name: Build przed deployem
      run: |
        node scripts/build-products-lite.mjs
        node scripts/generate-product-card-images.mjs --only-missing
        node scripts/build-product-webp.mjs
        node scripts/generate-product-pages.mjs
        node scripts/patch-products-lite.mjs
        node scripts/patch-root-nav-links.mjs

    - name: Sync plików przez FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /public_html/proteiner.pl/
        # UWAGA: to NIE jest parametr tej akcji — GitHub go ignoruje
        # ("Unexpected input(s) 'delete'"), więc zdalne kasowanie nigdy nie
        # działało i na serwerze zostawały stare pliki. Akcja synchronizuje
        # usunięcia z repo sama (na podstawie stanu). Nie włączamy
        # "dangerous-clean-slate", bo kasuje CAŁY katalog na serwerze
        # (usunęłoby też data/ z bazą i config.local.php).
        log-level: verbose
        exclude: |
          **/.git*
          **/.github/**
          **/node_modules/**
          **/.cursor/**
          **/deploy-bundle/**
          **/.hotfix-ftp/**
          **/.ftp-deploy-sync-state.json
          **/scripts/**
          **/package.json
          **/package-lock.json
          **/sw.js
          **/js/products-data-raw.js
          **/api/config.local.php
          **/data/**
          **/data/*.sqlite
          # WebP z alfą (~15 MB) na neon; PNG pomijamy (duże). JPG zostaje jako fallback/OG.
          # Wyjątki tylko z katalogu głównego — NIE z deploy-bundle/
          # (inaczej FTP próbuje upload do nieistniejącego deploy-bundle/ na serwerze → 550).
          **/images/products/*.png
          !images/products/sos-1000-wysp.png
          !images/products/biszkopty.png
          **/domains/**

    - name: Weryfikacja deployu
      run: |
        sleep 20
        for url in \
         "https://proteiner.pl/" \
         "https://proteiner.pl/dieta#produkty" \
         "https://proteiner.pl/porownaj-produkty" \
         "https://proteiner.pl/js/products-lite.js" 
        do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
          if [ "$CODE" != "200" ]; then
             echo "::error::Weryfikacja nie powiodła się dla $url (HTTP $CODE)"
             exit 1
          fi
        done

  redirect-proteinmaxxing:
    name: Przekierowanie proteinmaxxing.pl
    runs-on: ubuntu-latest
    needs: web-deploy
    steps:
    - name: Pobranie kodu
      uses: actions/checkout@v4

    - name: Wgraj przekierowanie 301
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./domains/proteinmaxxing/
        server-dir: /public_html/proteinmaxxing.pl/
        timeout: 60000
        exclude: |
          .git
          .git/**
          **/.git
          **/.git/**
          **/.github/**
          **/node_modules/**
          **/.cursor/**
          **/deploy-bundle/**
          **/.hotfix-ftp/**
          **/.ftp-deploy-sync-state.json
          **/scripts/**
          **/package.json
          **/package-lock.json
          **/sw.js
          **/js/products-data-raw.js
          **/api/config.local.php
          **/data/**
          **/data/*.sqlite
          **/images/products/*.png
          !images/products/sos-1000-wysp.png
          !images/products/biszkopty.png
          **/domains/**

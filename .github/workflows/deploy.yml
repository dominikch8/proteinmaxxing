name: Deploy na serwer LH.pl

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Pobranie kodu
      uses: actions/checkout@v4

    - name: Sync plików przez FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /public_html/proteiner.pl/
        exclude: |
          **/.git*
          **/.github/**
          **/node_modules/**
          **/.cursor/**

  redirect-proteinmaxxing:
    name: Przekierowanie proteinmaxxing.pl
    runs-on: ubuntu-latest
    needs: web-deploy
    steps:
    - name: Pobranie kodu
      uses: actions/checkout@v4

    - name: Wgraj przekierowanie 301
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./domains/proteinmaxxing/
        server-dir: /public_html/proteinmaxxing.pl/
name: Deploy na serwer LH.pl

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Pobranie kodu
      uses: actions/checkout@v4

    - name: Sync plików przez FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /public_html/proteiner.pl/
        log-level: verbose
        exclude: |
          **/.git*
          **/.github/**
          **/node_modules/**
          **/.cursor/**
          **/deploy-bundle/**
          **/scripts/**
          **/package.json
          **/package-lock.json

    - name: Weryfikacja — cookie-banner.js na serwerze
      run: |
        sleep 15
        CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://proteiner.pl/js/cookie-banner.js" || true)
        echo "HTTP $CODE dla cookie-banner.js"
        if [ "$CODE" != "200" ]; then
          echo "::error::Deploy FTP zakończył się, ale cookie-banner.js nadal nie jest na serwerze (HTTP $CODE)."
          echo "Sprawdź ścieżkę server-dir w workflow lub wgraj ręcznie folder deploy-bundle/."
          exit 1
        fi

  redirect-proteinmaxxing:
    name: Przekierowanie proteinmaxxing.pl
    runs-on: ubuntu-latest
    needs: web-deploy
    steps:
    - name: Pobranie kodu
      uses: actions/checkout@v4

    - name: Wgraj przekierowanie 301
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./domains/proteinmaxxing/
        server-dir: /public_html/proteinmaxxing.pl/

name: Hotfix FTP (pojedyncze pliki)

# Awaryjny deploy małego zestawu plików, gdy pełny sync pada
# (np. "write EPIPE (data socket)" lub "ECONNRESET (data socket)").
# Wgrywa tylko wskazane pliki, w tej samej strukturze katalogów, co na stronie.
#
# Użycie: Actions -> "Hotfix FTP" -> Run workflow (można podać własne ścieżki).

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Ścieżki do wgrania (oddzielone przecinkami)'
        required: false
        default: 'js/meal-calculator.js,kalkulator-posilkow.html'

jobs:
  hotfix:
    name: Hotfix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Pobranie kodu
      uses: actions/checkout@v4

    - name: Przygotowanie stagingu
      run: |
        set -e
        LIST="${{ github.event.inputs.files }}"
        [ -z "$LIST" ] && LIST="js/meal-calculator.js,kalkulator-posilkow.html"
        IFS=',' read -ra ITEMS <<< "$LIST"
        for f in "${ITEMS[@]}"; do
          f="$(echo "$f" | xargs)"
          [ -z "$f" ] && continue
          if [ ! -f "$f" ]; then
            echo "::error::Brak pliku w repo: $f"
            exit 1
          fi
          mkdir -p ".hotfix-ftp/$(dirname "$f")"
          cp "$f" ".hotfix-ftp/$f"
          echo "staging: $f"
        done

    - name: Sync plików przez FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Staging odzwierciedla strukturę strony, więc
        # .hotfix-ftp/js/app.js trafia do /public_html/proteiner.pl/js/app.js
        local-dir: ./.hotfix-ftp/
        server-dir: /public_html/proteiner.pl/
        # Własny plik stanu, żeby nie mieszać się z pełnym deployem.
        state-name: .ftp-hotfix-state.json
        log-level: verbose
        exclude: |
          **/.git*
          **/.git/**